name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          # Public cache → pull with no token, on every event (incl. fork PRs).
          extra-conf: |
            extra-substituters = https://cache.lalala.casa/xnixvim
            extra-trusted-public-keys = xnixvim:9ZPNdLt+VqJRfOCmMQiB+goxckuVm0eiDGy18U21QCw=
      # Push only on trusted pushes to main or a tag — never on PRs — so the
      # token is absent from the untrusted path.
      - if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
        with:
          endpoint: https://cache.lalala.casa
          cache: xnixvim
          token: ${{ secrets.ATTIC_TOKEN }}
          skip-use: true # substituter already configured via extra-conf above
      - run: nix flake check --no-write-lock-file
